apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
data:
  init.sql: |
    CREATE DATABASE users;
    CREATE DATABASE products;
    CREATE DATABASE orders;
    CREATE DATABASE payments;
    CREATE DATABASE notifications;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: { app: postgres }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - { name: POSTGRES_USER,     valueFrom: { secretKeyRef: { name: shop-secrets, key: POSTGRES_USER } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: shop-secrets, key: POSTGRES_PASSWORD } } }
            - { name: POSTGRES_DB,       value: shop }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec: { command: ["pg_isready","-U","shop"] }
            initialDelaySeconds: 10
      volumes:
        - name: initdb
          configMap: { name: postgres-initdb }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
