apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service.name" . }}
  labels: {{- include "service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "service.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "{{ .Values.containerPort }}"
      labels: {{- include "service.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "service.serviceAccountName" . }}
      {{- if not .Values.runAsRoot }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      {{- end }}
      containers:
        - name: {{ include "service.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
          {{- if .Values.env }}
          envFrom:
            - configMapRef:
                name: {{ include "service.name" . }}-config
          {{- end }}
          {{- range .Values.envFromSecrets }}
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- if .Values.global }}
          {{- if .Values.global.tracing }}
          {{- if .Values.global.tracing.enabled }}
          env:
            - name: OTEL_SERVICE_NAME
              value: {{ include "service.name" . }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.global.tracing.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
          {{- end }}
          {{- end }}
          {{- end }}
          # Gives slow JVM starts (OTel agent, Flyway) up to ~5 min before liveness runs
          startupProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: {{ .Values.containerPort }}
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
