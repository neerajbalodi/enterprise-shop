apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: shop
data:
  POSTGRES_HOST: "postgres"
  POSTGRES_DB: "users"
  REDIS_HOST: "redis"
  KAFKA_BOOTSTRAP: "kafka:9092"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: shop
  labels: { app: user-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: user-service
          image: REPLACE_ME/user-service:latest
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: user-service-config }
            - secretRef: { name: user-service-secrets }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits:   { cpu: 750m, memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: shop
spec:
  selector: { app: user-service }
  ports:
    - port: 80
      targetPort: 8081
